[package]
name = "tinyweb"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Rust build of tinywebStack — family node (gossip + HTTP API)"

[dependencies]
argon2 = "0.5"
crypto_secretbox = "0.1"
crypto_box = { version = "0.9", features = ["salsa20"] }
curve25519-dalek = "4"
ed25519-dalek = "2"
getrandom = "0.2"
prost = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
chacha20poly1305 = "0.10"

[build-dependencies]
prost-build = "0.13"
